<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Kasiomobile</title>

/* Kasiomobile na iPhone'a i w przeglądarce (do 18.10.2026 „Auta”). Ten sam układ co aplikacja na Androidzie.
   Od 19.10.2026 nagłówek to jeden rząd: logo Kasi, napis „Kasiomobile®”, asystent i Odśwież jako białe kółka. Cztery zakładki
   z kolorowymi ikonami stoją na dole, jak pasek kart w iOS (Jacek: „brakuje nam … kolorków na tych menu … oczywiste i eleganckie,
   typu Apple Store”). Na szerokim ekranie zakładki stoją pod nagłówkiem, a od 1100 px w nagłówku, na środku.
   Napis (nr 20 „Dwa koła”, krzywe z zrob-napis-w-aplikacji.js) ma 26 px, mniej na wąskim telefonie. Tekst 17, 15 i 13 px,
   odstępy z wielokrotności 4 px, cele dotyku co najmniej 48 px. Kolory to role w jednym miejscu, motyw idzie za systemem,
   ciemny to czerń. Kontrast par liczy test.js na kolorach, które naprawdę widać. */
:root {
  color-scheme: light dark;
  --tlo: #f5f5f7;
  /* Tło ramki z zakładką ma kolor samych stron (biel, w ciemnym czerń), więc przy prawej krawędzi nie stoi szary pasek. */
  --strona: #ffffff;
  --tekst: #1d1d1f;
  --tekst2: #6e6e73;
  --akcent: #0071e3;
  /* Napis w akcencie: #0066cc ma 5,6:1 na bieli. */
  --akcent-tekst: #0066cc;
  /* Tor zakładek i suwak pod wybraną, jak przełącznik w iOS. Napis wybranej w akcencie na białym suwaku, 5,6:1. */
  --tor: #e8e8ed;
  --suwak: #ffffff;
  --wybrana: #0066cc;
  /* Białe kółka i pigułki: włosek, jasna krawędź u góry i miękki cień w dwóch warstwach (wzorzec THIS IS THE WAY, „Głębia”). */
  --przycisk: #ffffff;
  --wlos: rgba(0, 0, 0, .12);
  --blysk: rgba(255, 255, 255, .7);
  --cien: rgba(0, 0, 0, .12);
  --cien-mocny: rgba(0, 0, 0, .18);
  /* Napis obok logo (40 px), asystenta i Odśwież (po 48 px), odstępów i marginesów: szerokość ekranu minus 190 px,
     a napis ma 5,67 swojej wielkości szerokości. */
  --napis: clamp(17px, calc((100vw - 190px) / 5.67), 26px);
  --zwykly: 17px;
  --maly: 15px;
  --bok: 16px;
  --lewo: calc(env(safe-area-inset-left) + var(--bok));
  --prawo: calc(env(safe-area-inset-right) + var(--bok));
}
@media (prefers-color-scheme: dark) {
  :root {
    --tlo: #000000;
    --strona: #000000;
    --tekst: #ffffff;
    --tekst2: #c0bfbc;
    --akcent: #409cff;
    --akcent-tekst: #409cff;
    /* Suwak w szarości Apple, napis wybranej jaśniejszym błękitem, 5,6:1. Na czerni cienia nie widać, zostaje włosek. */
    --tor: #1c1c1e;
    --suwak: #3a3a3c;
    --wybrana: #78bbff;
    --przycisk: #2c2c2e;
    --wlos: rgba(255, 255, 255, .16);
    --blysk: rgba(255, 255, 255, 0);
    --cien: rgba(0, 0, 0, 0);
    --cien-mocny: rgba(0, 0, 0, 0);
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  display: flex;
  flex-direction: column;
  background: var(--tlo);
  color: var(--tekst);
  font: 400 var(--zwykly)/1.4 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--akcent); outline-offset: 2px; }
[hidden] { display: none !important; }
/* Tekst tylko dla czytnika ekranu (na przykład nowe miejsce przestawionej zakładki). */
.ukryte { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
/* Kształt kafelka ikon i gradienty: raz, dla wszystkich zakładek. Nie display: none, bo wtedy przeglądarki gubią gradienty. */
.wzory { position: absolute; width: 0; height: 0; overflow: hidden; }

/* Nagłówek w jednym rzędzie. Z prawej 4 px mniej: kółko 40 px stoi w polu 48 px, więc jego brzeg wypada 16 px od krawędzi,
   jak logo z lewej. Asystent i Odśwież to te same kółka (czat.css, .czat-ikonka i .czat-otworz). */
.glowa {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: calc(env(safe-area-inset-top) + 8px) calc(var(--prawo) - 4px) 8px var(--lewo);
}
/* Logo nr 9 dla Kasi w kafelku jak ikona na ekranie głównym (logo.svg robi zrob-logo-w-aplikacji.js). */
.logo { flex: none; width: 40px; height: 40px; }

  // Adres blob: ma to samo pochodzenie co aplikacja, więc katalog pamięta filtry, a odnośniki

    if (zapisz) pamiec.zapisz('zakladka', WIDOKI[widok]);

  }
  // Kolejność zakładek (od 18.10.2026, Jacek: „żeby taby na nawigacji w mobile menu też były dragable”). Od 20.10.2026 zakładka
  // jedzie pod palcem albo kursorem, a sąsiednie robią jej miejsce (Jacek: „żeby one były styl dragable”). Wystarczy pociągnąć
  // ją w bok, palcem o 10 px, myszą o 6 px, albo przytrzymać palcem 450 ms. Do 20.10.2026 palec musiał najpierw przytrzymać,
  // a zwykłe pociągnięcie nie robiło nic. Stuknięcie i ruch w pionie niczego nie przestawiają, a pasek się nie przewija, więc
  // palec nie przestawi niczego przypadkiem. Kolejność zostaje w telefonie, a przez 6 sekund stoi „Cofnij”. Z klawiatury Alt+← →.
  // Zakładka, której nie ma w zapisie (doszła w nowej wersji), staje za swoją poprzedniczką, jak na Androidzie i na komputerze.
  const pasekZakladek = $('.karty');
  // Suwak pod wybraną zakładką (od 19.10.2026): przesuwa się do stukniętej, po przestawieniu staje od razu.
  const suwak = el('span', { class: 'suwak', 'aria-hidden': 'true' });
  pasekZakladek.prepend(suwak);
  function przesunSuwak(ruch) {
    const b = segmenty[widok];
    if (!b || !b.offsetWidth) return;
    suwak.classList.toggle('bez-ruchu', !ruch);
    suwak.style.width = (b.offsetWidth - 6) + 'px';
    suwak.style.transform = `translateX(${b.offsetLeft + 3}px)`;
  }
  addEventListener('resize', () => przesunSuwak(false));
  const kolejnosc = () => segmenty.map((b, i) => [b, i]).sort(([a], [b]) => (a.compareDocumentPosition(b) & 4 ? -1 : 1)).map(([, i]) => i);
  const ustawKolejnosc = (k) => { for (const i of k) pasekZakladek.append(segmenty[i]); przesunSuwak(false); };
  const zapisanaKolejnosc = pamiec.czytaj('kolejnosc', null);
  if (Array.isArray(zapisanaKolejnosc)) {
    const k = zapisanaKolejnosc.map((n) => WIDOKI.indexOf(n)).filter((i, j, a) => i >= 0 && a.indexOf(i) === j);
    WIDOKI.forEach((_, i) => { if (!k.includes(i)) k.splice(k.indexOf(i - 1) + 1, 0, i); });
    ustawKolejnosc(k);
  }
  const cofnijPole = $('.cofnij-zakladki');
  let doCofniecia = null, zegarCofnij = 0;
  function pokazCofnij(tak) {
    clearTimeout(zegarCofnij);
    cofnijPole.hidden = !tak;
    if (tak) zegarCofnij = setTimeout(() => pokazCofnij(false), 6000);
    else doCofniecia = null;
  }
  function zapamietajKolejnosc(poprzednia) {
    const k = kolejnosc();
    if (k.join() === poprzednia.join()) return;
    pamiec.zapisz('kolejnosc', k.map((i) => WIDOKI[i]));
    pokazCofnij(true);
    doCofniecia = poprzednia;
  }
  $('#cofnij-zakladki').addEventListener('click', () => {
    if (!doCofniecia) return;
    ustawKolejnosc(doCofniecia);
    pamiec.zapisz('kolejnosc', doCofniecia.map((i) => WIDOKI[i]));
    pokazCofnij(false);
  });
  // Ciągnięcie: zakładka jedzie pod palcem w granicach paska, a sąsiad, którego zakryła do połowy, dojeżdża na jej dawne miejsce
  // (240 ms, jak suwak). W drzewie strony przechodzi sąsiad, a nie ciągnięta zakładka: przeniesiona traciłaby przechwycenie
  // wskaźnika. Puszczona dojeżdża na swoje miejsce. Gdy ciągnięcie przerwie system (pointercancel), kolejność wraca.
  const RUCH = 'transform 240ms cubic-bezier(.2, 0, 0, 1), box-shadow 240ms ease, background-color 240ms ease';
  const UNIES = 'box-shadow 120ms ease, background-color 120ms ease';
  const ciag = { b: null, x: 0, y: 0, id: 0, mysz: false, start: null, aktywne: false, bylRuch: false, zegar: 0, chwyt: 0 };
  const lewyPaska = () => pasekZakladek.getBoundingClientRect().left;
  function podnies() {
    const b = ciag.b;
    clearTimeout(ciag.zegar);
    ciag.aktywne = true;
    b.classList.add('ciagniety');
    b.style.transition = 'transform 120ms ease, ' + UNIES;
    b.style.transform = 'scale(1.06)';
  }
  // Ciągnięta zakładka stoi tam, gdzie palec, ale nie wychodzi poza pasek. Wybraną niesie razem z suwakiem, który leży pod nią.
  // Oddaje lewy brzeg zakładki w układzie paska.
  function nies(e) {
    const b = ciag.b, x = Math.min(Math.max(e.clientX - lewyPaska() - ciag.chwyt, 0), pasekZakladek.clientWidth - b.offsetWidth);
    b.style.transition = UNIES;
    b.style.transform = `translateX(${x - b.offsetLeft}px) scale(1.06)`;
    if (b === segmenty[widok]) { suwak.classList.add('bez-ruchu'); suwak.style.transform = `translateX(${x + 3}px)`; }
    return x;
  }
  function przestawSasiada(s, przed) {
    const bylo = s.getBoundingClientRect().left;
    pasekZakladek.insertBefore(s, przed);
    s.style.transition = 'none';
    s.style.transform = `translateX(${bylo - lewyPaska() - s.offsetLeft}px)`;
    void s.offsetWidth;
    s.style.transition = RUCH;
    s.style.transform = '';
  }
  pasekZakladek.addEventListener('pointerdown', (e) => {
    const b = e.target.closest('button');
    if (!b || !segmenty.includes(b) || ciag.aktywne || (e.pointerType === 'mouse' && e.button !== 0)) return;
    clearTimeout(ciag.zegar);
    Object.assign(ciag, { b, x: e.clientX, y: e.clientY, id: e.pointerId, mysz: e.pointerType === 'mouse', start: kolejnosc(), aktywne: false, bylRuch: false,
      chwyt: e.clientX - lewyPaska() - b.offsetLeft });
    // Przechwycenie od razu: ruch i puszczenie wracają tu także spoza paska, więc żadna zakładka nie zostaje uniesiona.
    try { b.setPointerCapture(e.pointerId); } catch { /* wskaźnik z testu */ }
    if (!ciag.mysz) ciag.zegar = setTimeout(podnies, 450);
  });
  pasekZakladek.addEventListener('pointermove', (e) => {
    if (!ciag.b || e.pointerId !== ciag.id) return;
    if (!ciag.aktywne) {
      const dx = Math.abs(e.clientX - ciag.x), dy = Math.abs(e.clientY - ciag.y);
      if (ciag.mysz ? dx >= 6 : dx >= 10 && dx >= dy) podnies();
      else { if (!ciag.mysz && dy > 10) { clearTimeout(ciag.zegar); ciag.b = null; } return; }
    }
    e.preventDefault();
    // Sąsiad ustępuje, gdy ciągnięta zakryje go do połowy, czyli gdy jej brzeg minie jego środek (jak w iOS). Wcześniej ustępował
    // dopiero zakryty cały. Próg w obie strony jest ten sam, więc nic nie skacze tam i z powrotem. Szybki ruch mija czasem
    // kilka zakładek naraz: przestawiamy po jednej, aż ciągnięta stanie między sąsiadami.
    const b = ciag.b;
    for (let i = 0; i < segmenty.length; i++) {
      const x = nies(e), rzad = kolejnosc().map((j) => segmenty[j]), m = rzad.indexOf(b), lewy = rzad[m - 1], prawy = rzad[m + 1];
      if (lewy && x < lewy.offsetLeft + lewy.offsetWidth / 2) przestawSasiada(lewy, b.nextSibling);
      else if (prawy && x + b.offsetWidth > prawy.offsetLeft + prawy.offsetWidth / 2) przestawSasiada(prawy, b);
      else break;
      if (b !== segmenty[widok]) przesunSuwak(true);
    }
  });
  function koniecCiagniecia(e) {
    if (!ciag.b || e.pointerId !== ciag.id) return;
    clearTimeout(ciag.zegar);
    const b = ciag.b, przerwane = e.type === 'pointercancel';
    ciag.b = null;
    if (!ciag.aktywne) return;
    ciag.aktywne = false;
    ciag.bylRuch = true;
    setTimeout(() => { ciag.bylRuch = false; }, 400);
    if (przerwane) ustawKolejnosc(ciag.start);
    b.classList.remove('ciagniety');
    b.style.transition = RUCH;
    b.style.transform = '';
    przesunSuwak(true);
    const k = kolejnosc();
    if (przerwane || k.join() === ciag.start.join()) return;
    zapamietajKolejnosc(ciag.start);
    powiedz(b.textContent.trim() + ': miejsce ' + (k.indexOf(segmenty.indexOf(b)) + 1) + ' z ' + segmenty.length);
  }
  for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) pasekZakladek.addEventListener(t, koniecCiagniecia);
  pasekZakladek.addEventListener('contextmenu', (e) => e.preventDefault());
  const ogloszenie = document.createElement('p');
  ogloszenie.className = 'ukryte';
  ogloszenie.setAttribute('aria-live', 'polite');
  document.body.append(ogloszenie);
  function powiedz(t) { ogloszenie.textContent = ''; requestAnimationFrame(() => { ogloszenie.textContent = t; }); }

  segmenty.forEach((s, i) => {
    s.addEventListener('click', (e) => {
      if (ciag.bylRuch) { ciag.bylRuch = false; e.preventDefault(); return; }
      pokazWidok(i, true);
    });
    s.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      const k = kolejnosc(), m = k.indexOf(i), o = e.key === 'ArrowRight' ? 1 : -1;
      if (e.altKey) {
        // Alt+← → przestawia zakładkę z fokusem, to samo co przeciąganie.
        const na = m + o;
        if (na < 0 || na >= k.length) return;
        const n = [...k];
        n.splice(m, 1);
        n.splice(na, 0, i);
        ustawKolejnosc(n);
        s.focus();
        zapamietajKolejnosc(k);
        powiedz(s.textContent.trim() + ': miejsce ' + (na + 1) + ' z ' + k.length);
        return;
      }
      const n = k[(m + o + k.length) % k.length];
      pokazWidok(n, true);
      segmenty[n].focus();
    });
  });

  // ---------------------------------------------------------------- asystent (od 19.10.2026)
  // Czat z komputerem w domu (czat.js). „Ręce”: odpowiedź pokazuje zakładkę, a w Katalagu model albo Podium.
  // Mikrofon tylko tam, gdzie strona go dostaje (Safari i Chrome pod https); spod auta:// w aplikacji na iPhone'a go nie ma.
  const ZAKLADKI_CZATU = ['katalog', 'modele', 'kredyt', 'historia'];
  // Bez mikrofonu w aplikacji na iPhone'a: Info.plist nie ma zgody na mikrofon (NSMicrophoneUsageDescription), więc nagrywać
  // by nie mogła. Na iPhonie mikrofon ma strona w sieci w Safari.
  const czat = window.Czat && KANAL ? Czat.uruchom({
    kanal: KANAL, tryb: 'arkusz', mikrofon: SKAD !== 'iPhone', skad: SKAD,
    zakladka: () => ZAKLADKI_CZATU[widok],
    async pokaz(p) {
      const nr = ZAKLADKI_CZATU.indexOf(p.zakladka === 'nowe' ? 'katalog' : p.zakladka);
      if (nr < 0) return;
      await pokazWidok(nr, true);
      if (nr === 1 && (p.model || p.podium)) STRONY[1].el.contentWindow.postMessage({ auta: 'pokaz', model: p.model || null, podium: p.podium || null }, '*');
    },
  }) : null;
  const przyciskCzatu = $('#czat-otworz');
  if (czat) { Czat.dymek(przyciskCzatu); przyciskCzatu.addEventListener('click', () => czat.otworz()); } else przyciskCzatu.hidden = true;
  // Gest „wstecz” (przeciągnięcie od lewej krawędzi, Aplikacja.swift): najpierw zamyka czat, potem okno w stronie
  // bieżącej zakładki (szczegóły auta, filtry, galerię zdjęć), jak przycisk Wstecz na Androidzie.
  function wstecz() {
    if (czat && czat.otwarty()) { czat.zamknij(); return true; }
    try {
      const d = STRONY[widok].el.contentDocument.querySelector('dialog[open]');
      if (d) { d.close(); return true; }
    } catch { /* strona się jeszcze wczytuje */ }
    return false;
  }

  // ---------------------------------------------------------------- odświeżanie
  // Przy każdym otwarciu aplikacji: najpierw to, co komputer już przysłał, potem (katalog starszy niż 10 minut
  // albo stuknięcie „Odśwież”) prośba o skan i czekanie na nowy katalog, najwyżej 6 minut, co 10 sekund.
  let trwa = null, czekanie = null, prosba = false;
  const opis = (r) => {
    if (r.status === 'rejected') return 'błąd: ' + ((r.reason && r.reason.message) || r.reason);
    return r.value ? 'nowy' : 'bez zmian';
  };
  async function czekajNaKomputer() {
    let od = 0;
    try { od = await poprosOSkan(); } catch { return 'bez sieci'; }
    let doszedl = false;
    const koniec = Date.now() + CZEKAM_MS;
    while (Date.now() < koniec) {
      await pauza(10000);
      try { await KATALOG.sprawdz(); } catch { /* następna próba za 10 sekund */ }
      // Katalog nowszy niż prośba: komputer skończył.
      if (KATALOG.czas() >= od) { doszedl = true; break; }
    }
    await Promise.allSettled([KALKULATOR.sprawdz(), HISTORIA.sprawdz(), MODELE.sprawdz()]);
    brakOdpowiedzi = !doszedl;
    await pokazStrone(widok);
    return doszedl ? 'nowy katalog' : 'komputer nie odpowiedział';
  }
  function odswiez(recznie = false) {
    if (!KANAL) return Promise.resolve({ blad: 'brak kanału' }); // strona z sieci otwarta bez linku od Jacka
    if (czekanie) return trwa || czekanie; // komputer już sprawdza na naszą prośbę
    if (recznie) prosba = true;
    if (trwa) return trwa;
    pokazPrace(true);
    pobieram = true;
    pokazStrone(widok);
    trwa = (async () => {
      const [k, c, h, md] = await Promise.allSettled([KATALOG.sprawdz(), KALKULATOR.sprawdz(), HISTORIA.sprawdz(), MODELE.sprawdz()]);
      pobieram = false;
      bezSieci = k.status === 'rejected';
      await pokazStrone(widok);
      const wynik = { katalog: opis(k), kalkulator: opis(c), historia: opis(h), modele: opis(md) };
      if (!bezSieci && (prosba || Date.now() - KATALOG.czas() * 1000 > SWIEZE)) {
        prosba = false;
        wynik.prosba = 'wysłana';
        czekanie = czekajNaKomputer().finally(() => { czekanie = null; pokazPrace(false); });
      } else {
        prosba = false;
        pokazPrace(false);
      }
      return wynik;
    })().finally(() => { trwa = null; pobieram = false; });
    return trwa;
  }
  przyciskOdswiez.addEventListener('click', () => odswiez(true));
  if (!KANAL) przyciskOdswiez.hidden = true;
  document.querySelectorAll('.pusto button').forEach((b) => b.addEventListener('click', () => odswiez(true)));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) odswiez(); });
  // Póki aplikacja jest na ekranie, co minutę sprawdza, czy komputer przysłał nowe ogłoszenia (od 20.10.2026: e-mail z Otomoto
  // robi skan od razu, a nowe auto ma być w aplikacji od razu). Bez prośby o skan, więc komputer nie pracuje przez to więcej.
  const TEST = /[?&]test=\d/.test(location.search);
  setInterval(async () => {
    if (document.hidden || !KANAL || TEST || trwa || czekanie) return;
    try { if (await KATALOG.sprawdz()) { opiszOdswiez(); await pokazStrone(widok); } } catch { /* następna próba za minutę */ }
  }, 60000);

  // ---------------------------------------------------------------- start
  const naStarcie = Promise.all([schowek.czytaj('katalog'), schowek.czytaj('kalkulator'), schowek.czytaj('historia'), schowek.czytaj('modele')])
    .then(([k, c, h, md]) => ({ katalog: Boolean(k), kalkulator: Boolean(c), historia: Boolean(h), modele: Boolean(md) }));
  // Ostatnia zakładka nazwą. Dawne „Nowe” (do 19.10.2026) i brak zapisu dają Ogłoszenia.
  pokazWidok(Math.max(0, WIDOKI.indexOf(pamiec.czytaj('zakladka', null))), false);
  requestAnimationFrame(() => przesunSuwak(false));
  if (document.fonts) document.fonts.ready.then(() => przesunSuwak(false));
  opiszOdswiez();
  const pierwsze = KANAL ? naStarcie.then(() => odswiez()) : Promise.resolve({ blad: 'brak kanału' });

  window.Auta = {
    naStarcie, pierwsze, odswiez, pokazWidok, wstecz, czat,
    czekanie: () => czekanie,
    stan: () => ({
      katalogCzas: KATALOG.czas(), kalkulatorCzas: KALKULATOR.czas(), historiaCzas: HISTORIA.czas(), modeleCzas: MODELE.czas(),
      schowek: schowek.rodzaj, ramkaKatalogu: STRONY[0].ramka.sposob, ramkaModeli: STRONY[1].ramka.sposob,
      ramkaKredytu: STRONY[2].ramka.sposob, ramkaHistorii: STRONY[3].ramka.sposob, widok, nazwa: NAZWY[widok],
    }),
  };
  if (/[?&]test=\d/.test(location.search)) document.head.append(el('script', { src: 'test.js' }));
})();
</script>
</body>
