<!doctype html>
<!-- Kasiomobile w przeglądarce. Robi go zrob-kasiomobile-html.js ze strony iPhone'a, więc nie poprawiaj go ręcznie. -->
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Kasiomobile</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ikona-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kasiomobile">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Kasiomobile na iPhone'a i w przeglądarce (do 18.10.2026 „Auta”). Ten sam układ co aplikacja na Androidzie.
   Od 19.10.2026 nagłówek to jeden rząd: logo Kasi, napis „Kasiomobile®”, asystent i Odśwież jako białe kółka. Cztery zakładki
   z kolorowymi ikonami stoją na dole, jak pasek kart w iOS (Jacek: „brakuje nam … kolorków na tych menu … oczywiste i eleganckie,
   typu Apple Store”). Na szerokim ekranie zakładki stoją pod nagłówkiem, a od 1100 px w nagłówku, na środku.
   Napis (nr 20 „Dwa koła”, krzywe z zrob-napis-w-aplikacji.js) ma 26 px, mniej na wąskim telefonie. Tekst 17, 15 i 13 px,
   odstępy z wielokrotności 4 px, cele dotyku co najmniej 48 px. Kolory to role w jednym miejscu, motyw idzie za systemem,
   ciemny to czerń. Kontrast par liczy test.js na kolorach, które naprawdę widać. */
:root {
  color-scheme: light dark;
  --tlo: #ffffff;
  /* Tło ramki z zakładką ma kolor samych stron (biel, w ciemnym czerń), więc przy prawej krawędzi nie stoi szary pasek. */
  --strona: #ffffff;
  --tekst: #1d1d1f;
  /* Drugi plan #636366 (od 26.10.2026): 5,99:1 na bieli, 5,5:1 na #f5f5f7. */
  --tekst2: #636366;
  --akcent: #0071e3;
  /* Napis w akcencie: #0066cc ma 5,6:1 na bieli. */
  --akcent-tekst: #0066cc;
  /* Białe kółka i pigułki: włosek, jasna krawędź u góry i miękki cień w dwóch warstwach (wzorzec THIS IS THE WAY, „Głębia”). */
  --przycisk: #ffffff;
  --wlos: rgba(0, 0, 0, .12);
  --blysk: rgba(255, 255, 255, .7);
  --cien: rgba(0, 0, 0, .12);
  --cien-mocny: rgba(0, 0, 0, .18);
  /* Napis obok logo (40 px) i asystenta (48 px), odstępów i marginesów siatki: szerokość ekranu minus 110 px i dwa marginesy,
     a napis ma 5,67 swojej wielkości szerokości. */
  --napis: clamp(14px, calc((100vw - 2 * var(--km-bok) - 110px) / 5.67), 26px);
  --zwykly: 17px;
  --maly: 15px;
  --bok: 16px;
  --lewo: calc(env(safe-area-inset-left) + var(--bok));
  --prawo: calc(env(safe-area-inset-right) + var(--bok));
  /* Siatka aplikacji (od 24.10.2026, Jacek: „not aligned to kolumnes below them”, „EVERY FUCKIN WHERE”): ta sama co w Ogłoszeniach,
     czyli w katalogu Skanera: margines clamp(…, 3vw, 28px), treść najwyżej 1624 px na środku, od 1100 px kolumna filtrów 312 px
     i 24 px przerwy (--km-kolumna; Skaner ma 26 px, a odstępy idą ze skali 4 i 8 px). Strony w zakładkach dostają ją przy wczytaniu (app.js, „siatka”), więc logo, zakładki i kółka
     stoją nad krawędziami treści na każdej zakładce i przy każdej szerokości. --km-pasek to pasek przewijania w ramkach (mierzy go
     app.js; na telefonie i Macu 0, bo pływa nad treścią). --km-x0 i --km-x1 to odległość treści od lewej i prawej krawędzi okna. */
  --km-bok: clamp(16px, 3vw, 28px);
  --km-pasek: 0px;
  --km-tresc: 1624px;
  --km-kolumna: 336px;
  --km-lewo: calc(env(safe-area-inset-left) + var(--km-bok));
  --km-prawo: calc(env(safe-area-inset-right) + var(--km-bok));
  --km-margines: max(0px, calc((100vw - var(--km-pasek) - var(--km-tresc) - var(--km-lewo) - var(--km-prawo)) / 2));
  --km-x0: calc(var(--km-margines) + var(--km-lewo));
  --km-x1: calc(var(--km-margines) + var(--km-prawo) + var(--km-pasek));
  /* Wcięcie u góry ekranu (wycięcie aparatu albo czujników): na iPhonie i w przeglądarce z env(), a na Androidzie, gdzie strona
     sięga pod pas przy aparacie, wpisuje je MainActivity.java (podajGore). Nagłówek stoi na środku tego pasa razem ze swoim rzędem. */
  --km-gora: env(safe-area-inset-top, 0px);
  /* Siatka na telefonie (od 25.10.2026): 12 kolumn między brzegami treści i jedna rynna 8 px, ta sama między zakładkami, pigułkami
     i ich rzędami, do tego jeden promień rogów (Jacek: „wszystko musi być równane do gridu … Kątki wszystkie też powinny być fajne”;
     reguła siatka-wszedzie: na telefonie 8 px). Do wieczora 25.10.2026 rynna miała 12 px, a 8 px tylko poniżej 380 px. Szeroki ekran
     (od 760 px) ma swoje 16 px. */
  --km-rynna: 8px;
  --km-rog: 18px;
  /* Przyciski jak przyciski (od 26.10.2026; Jacek: „wybraliśmy … czwarte … takie mają być wszędzie. Koniec. Kropka”, „Słońce świecące
     … z lewego górnego narożnika … pod 45 stopni … I takie drop shadow … szkło z iOS 26, reaktywność … Butony to są butony”): wariant 4
     „Szkło z iOS 26” ze strony „Przyciski jak przyciski - propozycje” (projekt 15), oświetlony z lewego górnego rogu pod 45°: blask
     i jasny brzeg z lewej u góry, ciemniejszy brzeg z prawej u dołu i cień rzucony w prawo w dół, w trzech warstwach. Wciśnięty rośnie
     o 3% i rozświetla się od miejsca dotyku, puszczony wraca sprężyście. Te same liczby mają strony w zakładkach (SW w app.js) i okno
     na komputerze. Do 26.10.2026 światło szło z góry, a wciśnięty przycisk zapadał się w cień. Napis na barwie wybranej zakładki jest
     biały w jasnym motywie i czarny w ciemnym. */
  --g3d: linear-gradient(135deg, rgba(255, 255, 255, .8), rgba(255, 255, 255, 0) 46%, rgba(0, 0, 0, .045));
  --g3d-barwa: linear-gradient(135deg, rgba(255, 255, 255, .2), rgba(255, 255, 255, 0) 34%, rgba(0, 0, 0, .1));
  --c3d: inset 1px 1px 0 rgba(255, 255, 255, .95), inset -1px -1px 0 rgba(0, 0, 0, .07), 0 0 0 .5px rgba(0, 0, 0, .16), 1px 1px 2px rgba(0, 0, 0, .12), 3px 3px 8px rgba(0, 0, 0, .1), 6px 6px 18px rgba(0, 0, 0, .06);
  --blik: rgba(255, 255, 255, .95);
  --plama-wcisk: rgba(255, 255, 255, .5);
  --na-barwie: #ffffff;
  /* Odstęp pod nawigacją na telefonie: zwykły (jak logo od góry ekranu) i najmniejszy, do którego da się ją przenieść (app.js). */
  --km-dol-baza: max(calc(var(--km-gora) / 2 + 12px), calc(env(safe-area-inset-bottom) - 10px));
  --km-dol-min: max(4px, calc(env(safe-area-inset-bottom) - 10px));
}
@media (prefers-color-scheme: dark) {
  :root {
    --tlo: #000000;
    --strona: #000000;
    --tekst: #ffffff;
    --tekst2: #c0bfbc;
    --akcent: #409cff;
    --akcent-tekst: #409cff;
    --przycisk: #2c2c2e;
    --wlos: rgba(255, 255, 255, .16);
    --blysk: rgba(255, 255, 255, 0);
    --cien: rgba(0, 0, 0, 0);
    --cien-mocny: rgba(0, 0, 0, 0);
    --g3d: linear-gradient(135deg, rgba(255, 255, 255, .17), rgba(255, 255, 255, 0) 50%);
    --g3d-barwa: linear-gradient(135deg, rgba(255, 255, 255, .22), rgba(255, 255, 255, 0) 34%, rgba(0, 0, 0, .12));
    --c3d: inset 1px 1px 0 rgba(255, 255, 255, .24), inset -1px -1px 0 rgba(0, 0, 0, .45), 0 0 0 .5px rgba(255, 255, 255, .2);
    --blik: rgba(255, 255, 255, .4);
    --plama-wcisk: rgba(255, 255, 255, .22);
    --na-barwie: #000000;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  display: flex;
  flex-direction: column;
  background: var(--tlo);
  color: var(--tekst);
  font: 400 var(--zwykly)/1.4 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--akcent); outline-offset: 2px; }
[hidden] { display: none !important; }
/* Tekst tylko dla czytnika ekranu (na przykład nowe miejsce przestawionej zakładki). */
.ukryte { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
/* Kształt kafelka ikon i gradienty: raz, dla wszystkich zakładek. Nie display: none, bo wtedy przeglądarki gubią gradienty. */
.wzory { position: absolute; width: 0; height: 0; overflow: hidden; }

/* Nagłówek w jednym rzędzie, w siatce aplikacji: logo stoi nad lewą krawędzią treści, kółko asystenta nad prawą. Z prawej 4 px
   mniej: kółko 40 px stoi w polu 48 px (czat.css, .czat-ikonka i .czat-otworz). Godziny skanu i ściągi nie ma (Jacek, 24.10.2026,
   wieczorem: „nie potrzebujemy wiedzieć, kiedy został update'owany”, „tak prosto, że nie będzie potrzeba ściągi”). Rząd stoi na
   środku szarego pola razem z pasem przy wycięciu ekranu (Jacek: „On jest niżej trochę. Ja bym wolał, żeby na środku”): połowa
   wcięcia nad nim. Pod nim od 26.10.2026 tylko 8 px (Jacek: nagłówek „niepotrzebnie jest takie długie … Amatorsko to wygląda”): razem
   z odstępem strony logo stoi na środku między górą ekranu a pierwszą rzeczą w treści, a całe to pole ma jeden odcień. */
.glowa {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: calc(var(--km-gora) / 2 + 8px) calc(var(--km-x1) - 4px) 8px var(--km-x0);
}
/* Miarki siatki dla app.js: szerokość cienkiego paska przewijania i marginesy w pikselach, razem z wcięciami ekranu. */
.siatka-pasek { position: absolute; visibility: hidden; width: 100px; height: 40px; overflow: scroll; scrollbar-width: thin; }
.siatka-sonda { position: absolute; visibility: hidden; height: 0; padding: 0 var(--km-prawo) 0 var(--km-lewo); }
/* Logo nr 9 dla Kasi w kafelku jak ikona na ekranie głównym (logo.svg robi zrob-logo-w-aplikacji.js). Od 22.10.2026 to też
   przycisk: od 25.10.2026 stuknięcie otwiera to samo menu Otomoto co napis (app.js, „napis”), a do 24.10.2026 otwierało poradnik. Wygląda dalej jak logo; pole dotyku ma 48 px,
   a ujemny margines trzyma układ nagłówka taki, jak przy samym obrazku 40 px. */
.logo { position: relative; flex: none; display: grid; place-items: center; width: 48px; height: 48px; margin: -4px; padding: 0; border: 0; border-radius: 14px; background: none; }
.logo img { display: block; width: 40px; height: 40px; transition: transform 120ms ease, filter 400ms ease; }
/* Niespodzianka (od 26.10.2026 wieczorem, Jacek: „przytrzymać przez pół sekundy … samą ikonę”): po 0,5 s przytrzymania logo podskakuje raz,
   a po puszczeniu otwiera się tryb HAL (app.js, „Niespodzianka”; czat.js, „HAL”). Do tego dnia to przytrzymanie włączało kolorowe tło. */
.logo.niespodzianka img { animation: niespodzianka 420ms cubic-bezier(.3, 1.7, .5, 1); }
@keyframes niespodzianka { 40% { transform: scale(1.14) rotate(-6deg); } }
.logo:active img { transform: scale(.94); }
h1 { flex: 1; min-width: 0; display: flex; align-items: center; margin: 0 0 0 2px; }
/* Napis to krzywe w wielkości --napis; kolory ma w sobie, za motywem systemu. */
h1 .napis { display: block; flex: none; width: calc(var(--napis) * var(--szer)); height: calc(var(--napis) * var(--wys)); max-width: 100%; }
/* Napis to też przycisk (od 22.10.2026): stuknięcie pokazuje te same wyszukiwania na Otomoto (app.js, „napis”). Wygląda dalej jak
   napis. Pole dotyku ma 48 px wysokości, a ujemny margines trzyma układ nagłówka taki, jak przy samym napisie. */
h1 .napis-przycisk { display: flex; align-items: center; min-width: 0; max-width: 100%; height: 48px; margin: -14px 0; padding: 0; border: 0; border-radius: 12px; background: none; }
h1 .napis-przycisk .napis { transition: transform 120ms ease; }
h1 .napis-przycisk:active .napis { transform: scale(.97); }
main { flex: 1; min-height: 0; position: relative; }
/* Zakładka: pigułki u góry (w Ogłoszeniach i w Katalagu) i pod nimi strona z komputera na całą resztę ekranu. Strony pod pigułkami
   leżą jedna na drugiej, widać tę wybraną. */
.widok { position: absolute; inset: 0; display: flex; flex-direction: column; }
.ramki { position: relative; flex: 1; min-height: 0; }
.podwidok { position: absolute; inset: 0; }
.widok iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--strona); }
.pusto {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin: 0;
  padding: 24px var(--prawo) 24px var(--lewo);
  color: var(--tekst2);
  text-align: center;
}
.pusto p { max-width: 26em; margin: 0; text-wrap: balance; }
/* Pigułka: białe tło, napis w akcencie, głębia jak kółka w nagłówku (reguła przyciski-zawsze-jak-przyciski). */
.pigulka {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: 0 20px;
  border: 0;
  border-radius: 24px;
  background: var(--przycisk);
  color: var(--akcent-tekst);
  font-size: var(--maly);
  font-weight: 600;
  box-shadow: inset 0 .5px 0 var(--blysk), 0 0 0 .5px var(--wlos), 0 1px 2px var(--cien), 0 2px 6px var(--cien);
  transition: transform 120ms ease, box-shadow 120ms ease;
}
.pigulka:active { transform: scale(.96); }

/* Pasek zakładek (od 19.10.2026): cztery osobne przyciski, ikona nad nazwą (Jacek przez Czytadło: „Rozdzielić, poproszę”; reguła
   przyciski-zawsze-jak-przyciski, „Rząd przycisków”), od 25.10.2026 wieczorem przyciski 3D w barwach zakładek (część „Barwy zakładek”
   niżej). Każda zakładka jest co najmniej tak szeroka jak jej pogrubiona nazwa, więc wybór niczego nie przesuwa, a pod kursorem jasna
   plama szkła idzie za myszą i nic się nie rusza (Jacek, 20.10.2026: „literki się trochę przesuwają”). Od dolnej krawędzi ekranu pas
   stoi tak daleko, jak logo od górnej (Jacek, 24.10.2026: „przynajmniej tak od krawędzi ekranu, tak bufor jest u góry”): połowa górnego
   wcięcia i 12 px (--km-dol-baza). Na iPhonie to więcej niż wskaźnik ekranu głównego, a bez wcięć (przeglądarka) zostaje 12 px. */
.dol {
  flex: none;
  position: relative;
  z-index: 2;
  padding: 8px var(--km-x1) var(--km-dol-baza) var(--km-x0);
  background-color: var(--tlo-pasa);
  box-shadow: inset 0 .5px 0 var(--wlos);
  transition: background-color 200ms ease;
}
.karty { position: relative; display: flex; gap: var(--km-rynna); }
.karty [role="tab"] {
  flex: 1 1 0;
  min-width: 0;
  position: relative;
  isolation: isolate;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  /* 5 px między ikoną a nazwą: przy 6 px wybrana zakładka stała przy 1,5× o 0,6 px ekranu od środka (pomiar na zrzutach). */
  gap: 5px;
  height: 56px;
  padding: 0 4px;
  border: 0;
  border-radius: var(--km-rog);
  background-color: var(--pastel);
  background-image: var(--g3d);
  color: var(--tekst);
  font-size: clamp(12px, 3.4vw, 13px);
  font-weight: 500;
  white-space: nowrap;
  box-shadow: var(--c3d);
  /* Przestawianie: zakładkę ciągnie się palcem albo myszą (app.js). Bez touch-action: none przeglądarka wzięłaby ruch palca
     za przewijanie i przerwała ciągnięcie. Bez zaznaczania tekstu i menu iOS. */
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  transition: transform 120ms ease, box-shadow 160ms ease, background-color 160ms ease;
}
/* Nazwa i jej pogrubiona kopia w jednej komórce (szerokość grubszej), przycięte do wersalików, więc ikona z nazwą stoją na środku. */
.karty .nazwa { display: inline-grid; }
.karty .nazwa > span, .karty .nazwa::after { grid-area: 1 / 1; white-space: nowrap; text-box: trim-both cap alphabetic; }
.karty .nazwa::after { content: attr(data-nazwa); font-weight: 600; visibility: hidden; }
.karty [role="tab"]:focus-visible { outline: 2px solid var(--akcent); outline-offset: 6px; }
.znak { flex: none; display: block; width: 28px; height: 28px; }
/* Szkło pod kursorem i pod palcem (wariant 4): pod kursorem błysk światła idzie za myszą po górnej krawędzi, a wciśnięta zakładka
   rozświetla się od miejsca dotyku, między tłem a ikoną z nazwą (app.js podaje --mx i --my). Pigułki mają to samo. */
.karty [role="tab"]::after {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity 160ms ease;
  background: radial-gradient(56px 14px at var(--mx, 50%) 0, var(--blik), rgba(255, 255, 255, 0));
}
@media (hover: hover) { .karty [role="tab"]:hover::after { opacity: 1; } }
.karty [role="tab"]:active::after { opacity: 1; transition-duration: 50ms; background: radial-gradient(circle 80px at var(--mx, 50%) var(--my, 50%), var(--plama-wcisk), rgba(255, 255, 255, 0) 75%); }
/* Ciągnięta zakładka unosi się nad resztą i jedzie pod palcem (przesunięcie i powiększenie o 6% daje app.js), a reszta robi jej miejsce. */
.karty [role="tab"].ciagniety { z-index: 2; cursor: grabbing; box-shadow: 0 0 0 1px var(--barwa), 0 6px 16px var(--cien-mocny); }
/* „Cofnij” po przestawieniu zakładki, pigułki albo nawigacji (reguła cofnij-i-ponow: na telefonie nie ma Ctrl+Z). Od 26.10.2026
   wieczorem (Jacek: „musi troszkę wolniej … w innym kolorze … w miejscu, gdzie nic się nie dzieje … musi być widoczna … nie intruzywna.
   Teraz jest szary na szary … Ten sam pomysł … fajnie to znika, ale jak szkło … Delikatniej”): błękitne szkło z niebieskim napisem
   i strzałką, jak kółko asystenta, zamiast szarego na szarym. Stoi na środku, 12 px nad nawigacją: tam, gdzie przed chwilą był palec,
   i tam, gdzie „Cofnij” stawiają Apple i Material. Pod nim leży miękka poświata w kolorze tła (welon), więc nad zdjęciami i kartami robi
   się w tym miejscu spokojnie, jak pod pływającymi przyciskami w iOS 26. Ruch to szkło, które się skrapla i paruje: 0,4 s wpływa z mgiełki,
   do 2,4 s stoi całe (chwila na „ojej” i na stuknięcie), do 4,2 s szkło przejaśnia się, a welon znika, więc pod spodem widać treść,
   a do 6 s napis paruje w górę. Do końca da się w niego stuknąć, a pod kursorem i z fokusem z klawiatury stoi cały. Kontrast (skrypt):
   napis #0058b9 na #e3effd 5,8:1, strzałka #0071e3 4,0:1; w ciemnym #66b0ff na #10263f 6,7:1 i #409cff 5,4:1. */
.cofnij-zakladki { position: absolute; left: 0; right: 0; bottom: 100%; display: flex; justify-content: center; padding-bottom: 12px; pointer-events: none; }
.cofnij-zakladki::before { content: ""; position: absolute; left: 50%; bottom: 0; width: 300px; height: 72px; margin-left: -150px; opacity: 0; pointer-events: none;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--tlo-pasa, var(--tlo)) 78%, transparent) 40%, transparent); }
.cofnij-zakladki .pigulka {
  --c-tlo: rgba(227, 239, 253, .94); --c-tlo-jasne: rgba(227, 239, 253, .3);
  --c-cien: inset 1px 1px 0 rgba(255, 255, 255, .9), 0 0 0 1px rgba(0, 113, 227, .26), 0 2px 8px rgba(0, 72, 160, .14), 0 10px 28px rgba(0, 72, 160, .16);
  --c-cien-lekki: inset 1px 1px 0 rgba(255, 255, 255, 0), 0 0 0 1px rgba(0, 113, 227, .2), 0 2px 8px rgba(0, 72, 160, 0), 0 10px 28px rgba(0, 72, 160, 0);
  --c-cien-zero: inset 1px 1px 0 rgba(255, 255, 255, 0), 0 0 0 1px rgba(0, 113, 227, 0), 0 2px 8px rgba(0, 72, 160, 0), 0 10px 28px rgba(0, 72, 160, 0);
  --c-cien-kursor: inset 1px 1px 0 rgba(255, 255, 255, .9), 0 0 0 1px #0071e3, 0 2px 8px rgba(0, 72, 160, .14), 0 10px 28px rgba(0, 72, 160, .16);
  position: relative; z-index: 1; gap: 8px; padding: 0 20px 0 16px; pointer-events: auto; color: #0058b9;
  background-color: var(--c-tlo); -webkit-backdrop-filter: blur(16px) saturate(1.6); backdrop-filter: blur(16px) saturate(1.6); box-shadow: var(--c-cien);
}
.cofnij-zakladki .pigulka > * { pointer-events: none; }
.cofnij-zakladki .pigulka > svg { flex: none; color: #0071e3; }
@media (prefers-color-scheme: dark) {
  .cofnij-zakladki .pigulka {
    --c-tlo: rgba(16, 38, 63, .94); --c-tlo-jasne: rgba(16, 38, 63, .3);
    --c-cien: inset 1px 1px 0 rgba(255, 255, 255, .2), 0 0 0 1px rgba(64, 156, 255, .38), 0 2px 8px rgba(0, 0, 0, 0), 0 10px 28px rgba(0, 0, 0, 0);
    --c-cien-lekki: inset 1px 1px 0 rgba(255, 255, 255, 0), 0 0 0 1px rgba(64, 156, 255, .3), 0 2px 8px rgba(0, 0, 0, 0), 0 10px 28px rgba(0, 0, 0, 0);
    --c-cien-zero: inset 1px 1px 0 rgba(255, 255, 255, 0), 0 0 0 1px rgba(64, 156, 255, 0), 0 2px 8px rgba(0, 0, 0, 0), 0 10px 28px rgba(0, 0, 0, 0);
    --c-cien-kursor: inset 1px 1px 0 rgba(255, 255, 255, .2), 0 0 0 1px #409cff, 0 2px 8px rgba(0, 0, 0, 0), 0 10px 28px rgba(0, 0, 0, 0);
    color: #66b0ff;
  }
  .cofnij-zakladki .pigulka > svg { color: #409cff; }
}
.cofnij-zakladki.paruje .pigulka { animation: cofnij-paruje 6s linear forwards; }
.cofnij-zakladki.paruje::before { animation: cofnij-welon 6s linear forwards; }
@media (hover: hover) {
  .cofnij-zakladki.paruje .pigulka:hover { animation: none; }
  .cofnij-zakladki.paruje:has(.pigulka:hover)::before { animation: none; opacity: 1; }
}
.cofnij-zakladki.paruje .pigulka:focus-visible { animation: none; }
.cofnij-zakladki.paruje:has(.pigulka:focus-visible)::before { animation: none; opacity: 1; }
@keyframes cofnij-paruje {
  0% { opacity: 0; transform: translateY(10px) scale(.96); filter: blur(4px); animation-timing-function: cubic-bezier(.2, 0, 0, 1); }
  6.7% { opacity: 1; transform: none; filter: blur(0); }
  40% { opacity: 1; background-color: var(--c-tlo); box-shadow: var(--c-cien); animation-timing-function: ease-in-out; }
  70% { opacity: 1; transform: none; filter: blur(0); background-color: var(--c-tlo-jasne); box-shadow: var(--c-cien-lekki); animation-timing-function: cubic-bezier(.4, 0, .6, 1); }
  100% { opacity: 0; transform: translateY(-8px) scale(1.04); filter: blur(4px); background-color: transparent; box-shadow: var(--c-cien-zero); }
}
@keyframes cofnij-welon {
  0% { opacity: 0; animation-timing-function: cubic-bezier(.2, 0, 0, 1); }
  6.7% { opacity: 1; }
  40% { opacity: 1; animation-timing-function: ease-in-out; }
  70% { opacity: 0; }
  100% { opacity: 0; }
}
/* Bez ruchu w systemie zostaje samo przenikanie, w tym samym czasie. */
@media (prefers-reduced-motion: reduce) { .cofnij-zakladki.paruje .pigulka { animation-name: cofnij-paruje-cicho; } }
@keyframes cofnij-paruje-cicho {
  0% { opacity: 0; }
  6.7% { opacity: 1; }
  40% { opacity: 1; background-color: var(--c-tlo); box-shadow: var(--c-cien); }
  70% { opacity: 1; background-color: var(--c-tlo-jasne); box-shadow: var(--c-cien-lekki); }
  100% { opacity: 0; background-color: transparent; box-shadow: var(--c-cien-zero); }
}
/* Pigułka pod kursorem dostaje obwódkę w akcencie, jak przyciski w Ofertach. Napis stoi w miejscu (do 20.10.2026 unosiła się o 1 px). */
@media (hover: hover) {
  .pigulka:hover { box-shadow: inset 0 .5px 0 var(--blysk), 0 0 0 1px var(--akcent), 0 1px 2px var(--cien), 0 2px 6px var(--cien); }
  .cofnij-zakladki .pigulka:hover { box-shadow: var(--c-cien-kursor); }
}

/* Otwarte okno w stronie (szczegóły auta, filtry, galeria) dostaje cały ekran: bez nagłówka i bez zakładek. */
body.okno .glowa { padding: var(--km-gora) 0 0; }
body.okno .glowa > *, body.okno .dol, body.okno .podwidoki { display: none; }
body.okno main { margin-bottom: env(safe-area-inset-bottom); }

/* Szeroki ekran: iPhone w poziomie i przeglądarka na komputerze. Zakładki stoją pod nagłówkiem, ikona obok napisu, i wypełniają
   kolumnę treści: do 1100 px całą szerokość treści, od 1100 px kolumnę aut w Ogłoszeniach (za filtrami). */
@media (min-width: 760px) {
  .glowa { order: -2; }
  .dol { order: -1; padding: 4px var(--km-x1) 12px var(--km-x0); box-shadow: none; }
  .karty { gap: 16px; }
  /* Nazwa 16 px w pigułce 40 px, jak w Czytadle: przy 15 px wersaliki stały przy 4× o 0,45 px za wysoko. */
  .karty [role="tab"] { flex-direction: row; gap: 8px; height: 40px; padding: 0 14px 0 10px; border-radius: 20px; font-size: 16px; }
  .znak { width: 24px; height: 24px; }
  .cofnij-zakladki { top: 100%; bottom: auto; padding: 12px 0 0; }
  .cofnij-zakladki::before { top: 0; bottom: auto; }
}
@media (width > 1100px) { .dol { padding-left: calc(var(--km-x0) + var(--km-kolumna)); } }
/* Od 1240 px zakładki mieszczą się w nagłówku, nad kolumną aut, na osi logo i kółek. */
@media (min-width: 1240px) {
  body { position: relative; }
  /* Zakładki stoją w nagłówku, a pigułki zostają w nawigacji pod nim, nad treścią. */
  .dol { padding: 0 var(--km-x1) 12px calc(var(--km-x0) + var(--km-kolumna)); }
  .karty { position: fixed; z-index: 3; top: calc(var(--km-gora) / 2 + 12px); left: calc(var(--km-x0) + var(--km-kolumna)); }
  /* Zakładki i pigułki po 176 px, co 16 px: dwie pigułki stoją dokładnie pod dwiema zakładkami, trzy pod trzema. */
  .karty [role="tab"] { flex: 0 0 176px; }
}
/* Menu pod napisem (od 22.10.2026): te same wyszukiwania na Otomoto, ukryte pod napisem Kasiomobile® (Jacek: „easter egg”). Karta z włoskiem
   i miękkim cieniem, w ciemnym sama obwódka. Każda pozycja to osobny przycisk z głębią, napis na środku wersalików. */
.menu-otomoto {
  position: fixed; z-index: 40; display: grid; gap: 8px; min-width: 264px; max-width: calc(100vw - 16px); padding: 8px; border-radius: 18px;
  background: var(--tlo); box-shadow: 0 0 0 .5px var(--wlos), 0 2px 6px var(--cien), 0 12px 32px var(--cien-mocny);
}
.menu-otomoto-tytul { margin: 4px 8px 0; color: var(--tekst2); font-size: 13px; font-weight: 600; }
.menu-otomoto button {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 48px; padding: 0 14px; border: 0; border-radius: 12px;
  background-color: var(--przycisk); background-image: var(--g3d); color: var(--tekst); text-align: left;
  box-shadow: var(--c3d);
  transition: transform 320ms cubic-bezier(.3, 1.7, .5, 1), box-shadow 120ms ease;
}
.menu-otomoto button:active { transform: scale(1.03); transition: transform 80ms ease, box-shadow 120ms ease; }
@media (hover: hover) { .menu-otomoto button:hover { box-shadow: 0 0 0 1px var(--akcent), var(--c3d); } }
.menu-otomoto-nazwa { text-box: trim-both cap alphabetic; }
.menu-otomoto-znak { flex: none; color: var(--akcent-tekst); }
@media (prefers-color-scheme: dark) { .menu-otomoto { background: #1c1c1e; box-shadow: 0 0 0 1px #48484a; } }
/* Pigułki w nawigacji (od 25.10.2026): w Ofertach Teraz i Historia, na Podium Podium Otomoto, Modele Otomoto i Wszystkie marki,
   w Finansach Leasing i Kredyt, a od wieczora w Poradniku Skrót i Całość. Stoją w nawigacji pod zakładkami (Jacek: „żebyśmy nie dzielili
   nawigacji na dwa, góra i dół”, „Te dolne są zależne od górnych”), a widać rząd wybranej zakładki (app.js). Każda zakładka ma swój rząd,
   więc nawigacja ma zawsze tę samą wysokość i nic nie skacze przy zmianie zakładki (Jacek: „nie ma przeskakiwania z menu”). Pigułka ma
   ten sam promień co zakładka, a brzegi rzędu stoją na liniach siatki. Pigułka na Podium ma dwie linie: co to jest i skąd (Jacek: „Czym
   są modele? … czy to są z Otomoto, czy nie”). Pole dotyku 48 px. */
.podkarty { position: relative; }
.podwidoki { display: flex; gap: var(--km-rynna); min-width: 0; }
.podwidoki [role="radio"] {
  position: relative; isolation: isolate; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 5px; height: 44px; padding: 0 8px; border: 0; border-radius: var(--km-rog); background-color: var(--przycisk); background-image: var(--g3d);
  color: var(--tekst); font-size: 15px; font-weight: 500; white-space: nowrap; box-shadow: var(--c3d);
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  transition: transform 120ms ease, box-shadow 160ms ease, background-color 160ms ease;
}
.podwidoki .nazwa { display: inline-grid; }
.podwidoki .nazwa > span, .podwidoki .nazwa::after { grid-area: 1 / 1; white-space: nowrap; text-box: trim-both cap alphabetic; }
.podwidoki .nazwa::after { content: attr(data-nazwa); font-weight: 600; visibility: hidden; }
/* Druga linia pigułki („Otomoto”, „Marki”) ma ten sam krój, wielkość i barwę co pierwsza (od 26.10.2026, Jacek: „jakby … były mniejszymi
   literami. Wszystko musi być równe. Marki … z dużej litery”; wcześniej 13 px w #3a3a3c). Jak pierwsza rezerwuje szerokość pogrubionej
   wersji (klasa nazwa w index.html), więc wybór niczego nie przesuwa. */
.podwidoki .skad { color: inherit; font-size: inherit; }
.podwidoki [role="radio"]:focus-visible { outline: 2px solid var(--akcent); outline-offset: 2px; }
.podwidoki [role="radio"]::after {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity 160ms ease;
  background: radial-gradient(56px 14px at var(--mx, 50%) 0, var(--blik), rgba(255, 255, 255, 0));
}
@media (hover: hover) { .podwidoki [role="radio"]:hover::after { opacity: 1; } }
.podwidoki [role="radio"]:active::after { opacity: 1; transition-duration: 50ms; background: radial-gradient(circle 80px at var(--mx, 50%) var(--my, 50%), var(--plama-wcisk), rgba(255, 255, 255, 0) 75%); }
.podwidoki [role="radio"]::before { content: ""; position: absolute; inset: -2px 0; }
.podwidoki [role="radio"].ciagniety { z-index: 2; cursor: grabbing; box-shadow: 0 0 0 1px var(--barwa), 0 6px 16px var(--cien-mocny); }

/* Barwy zakładek (od 25.10.2026 wieczorem; Jacek: „Zdechły niebieski … zdechłego zielonego … pseudo fiolet”, a paleta Apple: żywa barwa
   do akcentu, pastel z niej do rzeczy dyskretnych). Każda zakładka ma barwę z palety systemowej Apple: niebieskie Oferty, pomarańczowe Podium,
   zielone Finanse i fioletowy Poradnik (Oferty i Finanse zamieniły się barwami 26.10.2026, Jacek: „pomarańczowy jest excited”; wieczorem Oferty i Podium zamieniły się barwami: pierwsza niebieska, druga pomarańczowa). --gleboka to ta barwa przyciemniona tak, że biały napis ma na niej od 4,5:1, --zywa-c to
   żywa barwa ciemnego motywu, a --pastel z index.html to 16% barwy na bieli (w ciemnym 28% na #1c1c1e). --barwa to barwa wybranej rzeczy
   w bieżącym motywie: tło wybranej zakładki i pigułki, pierścień i pasek przenoszenia. Tło nagłówka, nawigacji i stron jest we wszystkich
   czterech zakładkach takie samo: biel, w ciemnym czerń (Jacek, 26.10.2026, po próbie z odcieniami barw zakładek na całym ekranie:
   „ten eksperyment z kolorem … się nie udało, wracamy do bieli wszystkich czterech takiej samej”). Kontrast każdej pary liczy skrypt. */
#seg-katalog, .podwidoki[data-z="katalog"], body[data-zakladka="katalog"] { --gleboka: #0071e3; --zywa-c: #0a84ff; }
#seg-modele, .podwidoki[data-z="modele"], body[data-zakladka="modele"] { --gleboka: #bc5500; --zywa-c: #ff9f0a; }
#seg-kredyt, .podwidoki[data-z="kredyt"], body[data-zakladka="kredyt"] { --gleboka: #1e7d36; --zywa-c: #30d158; }
#seg-poradnik, .podwidoki[data-z="poradnik"], body[data-zakladka="poradnik"] { --gleboka: #9a4fcf; --zywa-c: #bf5af2; }
body, .karty [role="tab"], .podwidoki { --barwa: var(--gleboka, var(--akcent)); }
body { --tlo-pasa: var(--tlo); background-color: var(--tlo-pasa); }
/* Tło strony, nagłówka i pasa nawigacji jest śnieżnobiałe (w ciemnym motywie czarne) w każdej zakładce (Jacek, 26.10.2026: „chodziło o ten
   biały”). Kolorowego tła, które do wieczora 26.10.2026 włączało przytrzymanie logo, już nie ma. */
@media (prefers-color-scheme: dark) {
  body, .karty [role="tab"], .podwidoki { --barwa: var(--zywa-c, var(--akcent)); }
  .karty [role="tab"]:not([aria-selected="true"]) { background-color: var(--pastel-c); }
}
.glowa { background-color: var(--tlo-pasa); transition: background-color 200ms ease; }
body.okno .glowa { background-color: var(--strona); }
/* Wybrana zakładka i pigułka (Jacek: „Butony muszą być butonami, a nie kawałkiem mięsa czy naklejki”, „wybrane ikony fizycznie jest
   mniejsza niż te, co są niewybrane. To jest oczywisty błąd designerski”, „nie jestem fanem tej niebieskiej ramki”, „ładne były
   rameczki … z dystansem … Nie tylko przylegające”): cała w barwie, z napisem na barwie, w pierścieniu 2 px z 2 px odstępu, który leży
   w rynnie siatki. Ikona wybranej zakładki ma tę samą wielkość co na niewybranej, a kafelek w barwie napisu. Smuga światła przechodzi
   przez wybraną raz, przy wyborze, i poza tym nic się nie rusza (od 26.10.2026, Jacek: „ograniczyć albo wyeliminować połyskiwania do
   minimum”; wcześniej smuga co 12 s i jasny ślad wokół pierścienia co 7 s). Smuga zostaje też przy ograniczonym ruchu, bo mówi, co wybrano. */
.karty [aria-selected="true"], .podwidoki [aria-checked="true"] {
  font-weight: 600;
  color: var(--na-barwie);
  background-color: var(--barwa);
  background-image: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .3) 50%, transparent 62%), var(--g3d-barwa);
  background-size: 260% 100%, 100% 100%;
  background-repeat: no-repeat;
  background-position: 0 0, 0 0;
  box-shadow: inset 1px 1px 0 rgba(255, 255, 255, .38), inset -1px -1px 0 rgba(0, 0, 0, .2), 1px 1px 2px rgba(0, 0, 0, .16), 3px 3px 10px color-mix(in srgb, var(--barwa) 42%, transparent), 6px 6px 18px rgba(0, 0, 0, .06);
}
.podwidoki [aria-checked="true"] { outline: 2px solid var(--barwa); outline-offset: 2px; }
.karty [aria-selected="true"], .podwidoki [aria-checked="true"].blysk { animation: polyskRaz 1.2s ease-in-out 1; }
@keyframes polyskRaz { from { background-position: 100% 0, 0 0; } to { background-position: 0 0, 0 0; } }
.karty [aria-selected="true"] .znak use { fill: var(--na-barwie); }
.karty [aria-selected="true"] .znak path { fill: var(--barwa); }
.karty [aria-selected="true"]::before {
  content: ""; position: absolute; inset: -4px; z-index: 1; padding: 2px; border-radius: calc(var(--km-rog) + 4px); pointer-events: none;
  background: var(--barwa);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
@media (prefers-color-scheme: dark) {
  .karty [aria-selected="true"], .podwidoki [aria-checked="true"] {
    box-shadow: inset 1px 1px 0 rgba(255, 255, 255, .42), inset -1px -1px 0 rgba(0, 0, 0, .28), 3px 3px 14px color-mix(in srgb, var(--barwa) 35%, transparent);
  }
}
/* Wciśnięty przycisk rośnie o 3% i rozświetla się od miejsca dotyku, a puszczony wraca sprężyście, jak szkło w iOS 26 (wariant 4;
   do 26.10.2026 zapadał się o piksel i o 2%). Przy przeciąganiu przejście ustawia app.js. */
.karty [role="tab"], .podwidoki [role="radio"] { transition: transform 320ms cubic-bezier(.3, 1.7, .5, 1), box-shadow 160ms ease, background-color 160ms ease; }
.karty [role="tab"]:active, .podwidoki [role="radio"]:active { transform: scale(1.03); transition: transform 80ms ease, box-shadow 160ms ease, background-color 160ms ease; }
/* Rozmowa z asystentem otwarta (od 26.10.2026, Jacek: „bardzo nie podoba mi się … brak jakiejkolwiek nawigacji po tych czatach”):
   na telefonie arkusz rozmowy kończy się nad nawigacją, a nawigacja stoi nad zasłoną i nad arkuszem, więc zakładki i pigułki widać

  -webkit-tap-highlight-color: transparent; transition: transform 320ms cubic-bezier(.3, 1.7, .5, 1), box-shadow 120ms ease; }
.czat-rozmowa-tytul { font-size: 16px; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.czat-rozmowa-kiedy { color: var(--cz-tekst2); font-size: 13px; line-height: 1.3; }
@media (hover: hover) { .czat-rozmowa:hover { box-shadow: 0 0 0 1px var(--cz-akcent), var(--cz-c3d); } }
.czat-rozmowa:active { transform: scale(1.03); transition: transform 80ms ease; }
.czat-rozmowa:focus-visible { outline: 2px solid var(--cz-akcent); outline-offset: 2px; }
.czat-arkusz .czat-gora { touch-action: none; }
.czat-uchwyt { position: absolute; top: 6px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--cz-ramka); }

/* Okrągłe przyciski: kółko 40 px w polu 48 px, z włoskiem, jasną krawędzią u góry i miękkim cieniem. */
.czat-ikonka { position: relative; flex: none; display: inline-grid; place-items: center; width: 48px; height: 48px; margin: 0; padding: 0; border: 0;
  border-radius: 50%; background: none; color: var(--cz-tekst); font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.czat-ikonka::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background-color: var(--cz-szary); background-image: var(--cz-lico);
  box-shadow: var(--cz-c3d);
  transition: transform 320ms cubic-bezier(.3, 1.7, .5, 1), background-color 120ms ease, box-shadow 120ms ease; }
.czat-ikonka > svg { position: relative; transition: transform 120ms ease; }
/* Pod kursorem kółko dostaje mocniejszy cień, a w ciemnym motywie, gdzie cienia nie widać, wyraźniejszy włosek. Nic się nie przesuwa
   (Jacek, 20.10.2026: „literki się trochę przesuwają … nie jest celowe ani sensowne”). Do 20.10.2026 kółko i znak unosiły się o 1 px. */
@media (hover: hover) { .czat-ikonka:not(:disabled):not(:focus-visible):hover::before { box-shadow: 0 0 0 1px var(--cz-akcent), var(--cz-c3d); } }
/* Wciśnięte kółko rośnie o 3%, jak szkło w iOS 26 (do 26.10.2026 malało o 6%). */
.czat-ikonka:not(:disabled):active::before { transform: scale(1.03); transition: transform 80ms ease; }
.czat-ikonka:focus-visible { outline: none; }
.czat-ikonka:focus-visible::before { box-shadow: 0 0 0 2px var(--cz-tlo), 0 0 0 4px var(--cz-akcent); }
/* Przycisk asystenta w nagłówku aplikacji (od 26.10.2026, Jacek: „ikonkę u góry, która znowu nie wiadomo, że jest ikonką”): kółko
   ze szkła w lekkim błękicie akcentu, z blaskiem z lewego górnego rogu i cieniem rzuconym w prawo w dół, a w nim iskry asystenta
   (Jacek o dymku w kółku: „wygląda jak chmurka w chmurce”). Wciśnięte rośnie o 3%. Na komputerze otwarty panel wypełnia kółko
   akcentem z białym znakiem (aria-expanded). Znak #0066cc ma na szkle 4,7:1, w ciemnym #78bbff na granacie 8,1:1. */
.czat-otworz::before { background-color: var(--cz-otworz-szklo); -webkit-backdrop-filter: blur(14px) saturate(1.8); backdrop-filter: blur(14px) saturate(1.8); }
.czat-otworz { color: var(--cz-akcent-tekst); }
.czat-otworz[aria-expanded="true"] { color: var(--cz-na-przycisku); }
.czat-otworz[aria-expanded="true"]::before { background-color: var(--cz-przycisk); background-image: var(--cz-lico-b); box-shadow: var(--cz-c3d-b); }
.czat-zamknij { color: var(--cz-tekst2); }
.czat-zamknij::before { inset: 8px; }
.czat-wyslij { color: var(--cz-na-przycisku); }
.czat-wyslij::before { background-color: var(--cz-przycisk); background-image: var(--cz-lico-b); box-shadow: var(--cz-c3d-b); }
.czat-wyslij:disabled { color: var(--cz-tekst2); cursor: default; }
.czat-wyslij:disabled::before { background: var(--cz-szary); box-shadow: 0 0 0 .5px var(--cz-wlosek); }
.czat-mik.nagrywa { color: #ffffff; }
/* Nagrywający mały mikrofon to też oko HAL-a (od 26.10.2026): czerwony środek w czarnej soczewce i srebrnym brzegu, bez znaku mikrofonu. */
.czat-mik.nagrywa::before { background-color: var(--cz-czerwony);
  background-image: radial-gradient(circle at 34% 30%, rgba(255, 255, 255, .75) 0 1px, rgba(255, 255, 255, 0) 4px),
    radial-gradient(circle, #ffd88a 0 4%, #ff5428 10%, #e10a0a 22%, #8c0000 40%, #2b0202 60%, #0a0a0a 74%);
  box-shadow: 0 0 0 2px #c7c7cc, 0 0 0 2.5px rgba(0, 0, 0, .3); }
.czat-mik.nagrywa > svg { opacity: 0; }
/* Puls wokół nagrywającego mikrofonu to sygnał stanu, więc zostaje także przy ograniczonym ruchu. */
.czat-mik.nagrywa::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; animation: czat-puls 1.4s ease-out infinite; }
@keyframes czat-puls { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--cz-czerwony) 55%, transparent); } to { box-shadow: 0 0 0 10px transparent; } }
.czat-mik:disabled { opacity: .5; cursor: default; }

/* Rozmowa: moje pytania z prawej w lekkim błękicie, odpowiedzi z lewej na szarym. Jedna oś przewijania. */
.czat-lista { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 4px 16px 16px; overflow-y: auto;
  overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: transparent transparent; }
/* Pasek listy widać dopiero pod kursorem, jak na stronach w zakładkach (od 21.10.2026). */
.czat-lista:hover { scrollbar-color: var(--cz-ramka) transparent; }
.czat-w { display: flex; flex-direction: column; gap: 8px; max-width: 88%; }
.czat-w.ja { align-self: flex-end; align-items: flex-end; }
.czat-w.ai { align-self: flex-start; align-items: flex-start; }
.czat-babelek { padding: 10px 14px; border-radius: 18px; background: var(--cz-pod); overflow-wrap: anywhere; }
.czat-w.ja .czat-babelek { background: var(--cz-ja); border-bottom-right-radius: 6px; }
.czat-w.ai .czat-babelek { border-bottom-left-radius: 6px; }
.czat-babelek p, .czat-babelek ul { margin: 0; }
.czat-babelek > * + * { margin-top: 8px; }
.czat-babelek ul { padding-left: 1.15em; }
.czat-babelek li + li { margin-top: 4px; }
.czat-babelek.blad { background: transparent; box-shadow: inset 0 0 0 1px var(--cz-czerwony); }
/* Trzy kropki, póki komputer myśli: sygnał pracy, zostaje także przy ograniczonym ruchu. */
.czat-mysli .czat-babelek { display: inline-flex; gap: 5px; padding: 16px; }
.czat-mysli i { width: 7px; height: 7px; border-radius: 50%; background: var(--cz-tekst2); animation: czat-kropka 1.2s ease-in-out infinite; }
.czat-mysli i:nth-child(2) { animation-delay: .15s; }
.czat-mysli i:nth-child(3) { animation-delay: .3s; }
@keyframes czat-kropka { 0%, 60%, 100% { opacity: .35; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }

/* Pigułki pod odpowiedzią („Pokaż …”, odnośniki) i podpowiedzi: widać 40 px, cel 48 px dzięki przezroczystej obwódce. */
.czat-akcja, .czat-podpowiedz { position: relative; display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 40px; margin: 0; padding: 10px 18px;
  border: 0; border-radius: 20px; font: inherit; font-size: 15px; line-height: 1.3; text-align: left; text-decoration: none;
  cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform 320ms cubic-bezier(.3, 1.7, .5, 1), background-color 120ms ease, box-shadow 120ms ease; }
/* Cel dotyku 48 px: przezroczyste pole 4 px nad i pod widoczną pigułką (od 26.10.2026; wcześniej przezroczysta obwódka, przy której
   cień rzucony w prawo w dół odstawał od pigułki). */
.czat-akcja::before, .czat-podpowiedz::before { content: ""; position: absolute; inset: -4px 0; }
.czat-akcja { background-color: color-mix(in srgb, var(--cz-akcent) 12%, var(--cz-tlo)); background-image: var(--cz-lico); color: var(--cz-akcent-tekst); font-weight: 600;
  box-shadow: var(--cz-c3d); }
.czat-akcja > span { min-width: 0; }
.czat-akcja > svg { flex: none; }
.czat-podpowiedz { background-color: var(--cz-pod); background-image: var(--cz-lico); color: var(--cz-tekst); font-weight: 500; text-align: center;
  box-shadow: var(--cz-c3d); }
/* Pod kursorem wyraźniejsza obwódka, napis stoi w miejscu. */
@media (hover: hover) {
  .czat-akcja:not(:disabled):hover { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--cz-akcent) 70%, transparent), var(--cz-c3d); }
  .czat-podpowiedz:hover, .czat .czat-podpowiedz:hover { box-shadow: inset 0 0 0 1px var(--cz-tekst2), var(--cz-c3d); }
}
.czat-akcja:active, .czat-podpowiedz:active { transform: scale(1.03); transition: transform 80ms ease; }
.czat-akcja:focus-visible, .czat-podpowiedz:focus-visible { outline: 2px solid var(--cz-akcent); outline-offset: -2px; }
.czat-akcja:disabled { opacity: .5; cursor: default; }
@media (prefers-color-scheme: dark) {
  .czat-akcja { background-color: color-mix(in srgb, var(--cz-akcent) 22%, var(--cz-tlo)); }
}
.czat-pusto { margin: auto 0; display: grid; justify-items: center; gap: 24px; padding: 16px 0 24px; text-align: center; color: var(--cz-tekst2); }
.czat-pusto > p { max-width: 22em; margin: 0; }
/* Oko HAL 9000 z „2001: Odysei kosmicznej” (od 26.10.2026, Jacek: „ever so slightly … reminiscent of HAL”): czarna soczewka z czerwonym środkiem
   w srebrnym pierścieniu, blask z lewego górnego rogu pod 45° i cień w prawo w dół jak na przyciskach. Żyje w trybie HAL (przytrzymanie logo,
   niżej) i w małym mikrofonie przy polu pytania, gdy nagrywa. Dużego oka na pustej rozmowie już nie ma (Jacek, 26.10.2026 wieczorem: „fajna,
   ale trochę przesadzona”). */
.czat-oko { position: relative; display: block; width: 84px; height: 84px; border-radius: 50%;
  background: linear-gradient(135deg, #fdfdfd, #d1d1d6 34%, #8e8e93 64%, #e5e5ea);
  box-shadow: 0 0 0 .5px rgba(0, 0, 0, .28), 1px 1px 2px rgba(0, 0, 0, .2), 3px 3px 10px rgba(0, 0, 0, .16), 6px 6px 20px rgba(0, 0, 0, .1); }
.czat-oko::after { content: ""; position: absolute; inset: 7px; border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, rgba(255, 255, 255, .9) 0 2px, rgba(255, 255, 255, .25) 4px, rgba(255, 255, 255, 0) 8px),
    radial-gradient(circle, #ffd88a 0 3%, #ff5428 7%, #e10a0a 15%, #8c0000 28%, #2b0202 43%, #0a0a0a 55%, #050505);
  box-shadow: inset 0 0 0 2px #111111, inset 2px 2px 4px rgba(255, 255, 255, .12), inset -2px -2px 6px rgba(0, 0, 0, .6); }
@keyframes czat-hal {
  0%, 100% { filter: brightness(1.05) saturate(1.1); box-shadow: inset 0 0 0 2px #111111, 0 0 10px 2px rgba(255, 40, 20, .35); }
  50% { filter: brightness(1.45) saturate(1.3); box-shadow: inset 0 0 0 2px #111111, 0 0 26px 9px rgba(255, 40, 20, .6); } }
/* Podpowiedzi (od 26.10.2026 wieczorem, Jacek: pastele „jak z jarmarku”, „co by Apple zrobił? … szarawe”, „więcej powietrza”): jedna spokojna
   barwa, szare szkło z 45° światłem jak inne przyciski, napis w kolorze tekstu (13:1 w jasnym, 12:1 w ciemnym), 56 px wysokości, 16 px odstępu. */
.czat-podpowiedzi { display: flex; flex-direction: column; align-items: stretch; gap: 16px; width: 100%; max-width: 480px; }
.czat .czat-podpowiedz { justify-content: center; min-height: 56px; margin: 0; padding: 14px 24px; border: 0; border-radius: 28px; font-size: 16px; font-weight: 500; line-height: 1.4;
  color: var(--cz-tekst); background-color: var(--cz-szary); background-image: var(--cz-lico); box-shadow: var(--cz-c3d); }

/* Pole pytania na dole: tekst, mikrofon (gdy jest) i wysyłanie. Od dolnej krawędzi stoi jak pasek zakładek, czyli tak daleko
   jak logo od górnej (od 24.10.2026); przy klawiaturze i w panelu na komputerze 8 px. */
.czat-stan { flex: none; margin: 0; padding: 4px 16px; color: var(--cz-tekst2); font-size: 13px; text-align: center; }
.czat-pole { flex: none; display: flex; align-items: flex-end; gap: 4px; padding: 8px 8px max(calc(var(--km-gora, 0px) / 2 + 12px), calc(8px + env(safe-area-inset-bottom))) 16px;
  background: var(--cz-tlo); box-shadow: inset 0 .5px 0 var(--cz-ramka); }
.czat.klawiatura .czat-pole, .czat-panel .czat-pole { padding-bottom: 8px; }
.czat-tekst { flex: 1; min-width: 0; min-height: 48px; max-height: 132px; margin: 0; padding: 12px 16px; border: .5px solid var(--cz-ramka); border-radius: 24px;
  background: var(--cz-pod); color: var(--cz-tekst); font: inherit; line-height: 1.3; resize: none; overflow-y: auto; }
/* Pasek przewijania w polu (od 21.10.2026, Jacek: „It cuts in the windows, usually in the edges”): zaokrąglony róg pola ucinał
   gruby pasek ze strzałkami o 9,5 px. Teraz pasek jest cienki, widać go dopiero pod kursorem i zaczyna się 24 px od góry i od dołu,
   tyle, ile ma promień rogu, więc stoi w prostej części brzegu. Margines toru działa tylko w pasku ::-webkit-scrollbar, a Chromium
   wyłącza go, gdy element ma scrollbar-width albo scrollbar-color, dlatego oba stoją tu na auto (scrollbar-color się dziedziczy).
   Kolor pod kursorem idzie przez zmienną na samym polu: po samym :hover na pseudoelemencie Chromium paska nie odświeża (sprawdzone). */
.czat-tekst { --cz-kciuk: transparent; scrollbar-width: auto; scrollbar-color: auto; }
.czat-tekst:hover { --cz-kciuk: var(--cz-ramka); }
.czat-tekst::-webkit-scrollbar { width: 10px; }
.czat-tekst::-webkit-scrollbar-track { background: transparent; margin-top: 24px; margin-bottom: 24px; }
.czat-tekst::-webkit-scrollbar-thumb { border: 2px solid transparent; border-radius: 5px; background: var(--cz-kciuk) padding-box; }
.czat-tekst::placeholder { color: var(--cz-tekst2); opacity: 1; }
.czat-tekst:focus { outline: none; border-color: var(--cz-akcent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cz-akcent) 22%, transparent); }

/* Dymek przy ikonce bez podpisu: karta w stylu Apple, na środku pod ikonką. */
.czat-dymek { position: fixed; z-index: 1000; max-width: min(280px, calc(100vw - 16px)); padding: 6px 12px; border-radius: 10px;
  background: var(--cz-dymek-tlo); color: var(--cz-dymek-tekst); font: 500 13px/1.35 "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
  box-shadow: 0 0 0 .5px var(--cz-wlosek), 0 4px 14px rgba(0, 0, 0, .16); pointer-events: none; }
/* Archiwum i kosz w historii rozmów (od 26.10.2026): rozmowa przesuwa się w bok nad kolorem celu (napis biały: archiwum #5856d6 5,7:1,
   Historia #0071e3 4,7:1, kosz #d70015 5,4:1, w obu motywach). Lista nie przewija się w bok, gdy rozmowa wyjeżdża za krawędź. */
.czat-panel { position: relative; }
.czat-lista { overflow-x: hidden; }
.czat-rozmowy { display: flex; flex-direction: column; gap: 12px; }
.czat-wiersz { position: relative; border-radius: 18px; }
.czat-wiersz > .czat-rozmowa { z-index: 1; touch-action: pan-y; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.czat-pod { position: absolute; inset: 0; z-index: 0; display: flex; align-items: center; padding: 0 20px; border-radius: 18px;
  color: #ffffff; font-size: 15px; font-weight: 600; opacity: 0; pointer-events: none; }
.czat-wiersz.przesuwa > .czat-pod { opacity: 1; }
.czat-wiersz[data-kierunek="prawo"] > .czat-pod { background-color: var(--k-prawo); }
.czat-wiersz[data-kierunek="lewo"] > .czat-pod { background-color: var(--k-lewo); justify-content: flex-end; }
.czat-pod-l, .czat-pod-p { display: inline-flex; align-items: center; gap: 8px; }
.czat-pod-p { flex-direction: row-reverse; }
.czat-wiersz[data-kierunek="prawo"] .czat-pod-p, .czat-wiersz[data-kierunek="lewo"] .czat-pod-l { display: none; }
.czat-pod svg { flex: none; transition: transform 160ms cubic-bezier(.3, 1.7, .5, 1); }
.czat-wiersz.gotowe .czat-pod svg { transform: scale(1.2); }
/* Schowek (dawne Archiwum i Kosz) to jedna pigułka pod listą rozmów, na całą szerokość; w jego widoku są dwie sekcje, Zachowane i Kosz. */
.czat-schowki { display: flex; gap: 8px; margin-top: 4px; }
.czat-schowek { flex: 1 1 0; justify-content: center; min-width: 0; }
.czat-ile { min-width: 24px; height: 24px; margin-left: 2px; padding: 0 7px; border-radius: 12px; background: var(--cz-tlo);
  box-shadow: inset 0 0 0 1px var(--cz-wlosek); font-size: 13px; line-height: 24px; text-align: center; }
.czat-naglowek-listy { display: flex; align-items: center; gap: 12px; }
.czat-gdzie { margin: 0; color: var(--cz-tekst); font-size: 17px; font-weight: 600; line-height: 1.3; }
/* Menu rozmowy (przytrzymanie, prawy klik, klawisz menu): karta z ramką, pozycje to pigułki, kosz z czerwonym znakiem (4,4:1, grafika). */
.czat-menu { position: absolute; z-index: 5; display: grid; gap: 8px; min-width: 220px; padding: 8px; border-radius: 22px;
  background: var(--cz-tlo); box-shadow: 0 0 0 1px var(--cz-wlosek), 0 8px 28px var(--cz-cien); }
.czat-menu-poz { justify-content: flex-start; width: 100%; margin: 0; }
.czat-do-kosza > svg { color: var(--cz-czerwony); }
/* „Cofnij” po ruchu rozmowy wygląda i paruje tak samo jak w aplikacji (styl.css, „cofnij-paruje”, opis tam): błękitne szkło ze strzałką,
   pod nim welon w kolorze tła czatu, 0,4 s wpływa, do 2,4 s stoi całe, do 4,2 s przejaśnia się, do 6 s paruje. Pod kursorem i z fokusem stoi. */
.czat-cofnij-pole { position: absolute; left: 0; right: 0; bottom: 20px; z-index: 4; display: flex; justify-content: center; pointer-events: none; }
.czat-cofnij-pole::before { content: ""; position: absolute; left: 50%; bottom: -12px; width: 300px; height: 72px; margin-left: -150px; opacity: 0; pointer-events: none;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--cz-tlo) 78%, transparent) 40%, transparent); }
.czat-cofnij-pole .czat-pigulka {
  --c-tlo: rgba(227, 239, 253, .94); --c-tlo-jasne: rgba(227, 239, 253, .3);
  --c-cien: inset 1px 1px 0 rgba(255, 255, 255, .9), 0 0 0 1px rgba(0, 113, 227, .26), 0 2px 8px rgba(0, 72, 160, .14), 0 10px 28px rgba(0, 72, 160, .16);
  --c-cien-lekki: inset 1px 1px 0 rgba(255, 255, 255, 0), 0 0 0 1px rgba(0, 113, 227, .2), 0 2px 8px rgba(0, 72, 160, 0), 0 10px 28px rgba(0, 72, 160, 0);
  --c-cien-zero: inset 1px 1px 0 rgba(255, 255, 255, 0), 0 0 0 1px rgba(0, 113, 227, 0), 0 2px 8px rgba(0, 72, 160, 0), 0 10px 28px rgba(0, 72, 160, 0);
  --c-cien-kursor: inset 1px 1px 0 rgba(255, 255, 255, .9), 0 0 0 1px #0071e3, 0 2px 8px rgba(0, 72, 160, .14), 0 10px 28px rgba(0, 72, 160, .16);
  z-index: 1; height: 48px; margin: 0; padding: 0 20px 0 16px; border-radius: 24px; pointer-events: auto; color: #0058b9;
  background-color: var(--c-tlo); background-image: none; -webkit-backdrop-filter: blur(16px) saturate(1.6); backdrop-filter: blur(16px) saturate(1.6); box-shadow: var(--c-cien);
}
.czat-cofnij-pole .czat-pigulka > * { pointer-events: none; }
.czat-cofnij-pole .czat-pigulka > svg { color: #0071e3; }
@media (prefers-color-scheme: dark) {
  .czat-cofnij-pole .czat-pigulka {
    --c-tlo: rgba(16, 38, 63, .94); --c-tlo-jasne: rgba(16, 38, 63, .3);
    --c-cien: inset 1px 1px 0 rgba(255, 255, 255, .2), 0 0 0 1px rgba(64, 156, 255, .38), 0 2px 8px rgba(0, 0, 0, 0), 0 10px 28px rgba(0, 0, 0, 0);
    --c-cien-lekki: inset 1px 1px 0 rgba(255, 255, 255, 0), 0 0 0 1px rgba(64, 156, 255, .3), 0 2px 8px rgba(0, 0, 0, 0), 0 10px 28px rgba(0, 0, 0, 0);
    --c-cien-zero: inset 1px 1px 0 rgba(255, 255, 255, 0), 0 0 0 1px rgba(64, 156, 255, 0), 0 2px 8px rgba(0, 0, 0, 0), 0 10px 28px rgba(0, 0, 0, 0);
    --c-cien-kursor: inset 1px 1px 0 rgba(255, 255, 255, .2), 0 0 0 1px #409cff, 0 2px 8px rgba(0, 0, 0, 0), 0 10px 28px rgba(0, 0, 0, 0);
    color: #66b0ff;
  }
  .czat-cofnij-pole .czat-pigulka > svg { color: #409cff; }
}
@media (hover: hover) { .czat-cofnij-pole .czat-pigulka:not(:disabled):hover { box-shadow: var(--c-cien-kursor); } }
.czat-cofnij-pole.paruje .czat-pigulka { animation: czat-paruje 6s linear forwards; }
.czat-cofnij-pole.paruje::before { animation: czat-welon 6s linear forwards; }
@media (hover: hover) {
  .czat-cofnij-pole.paruje .czat-pigulka:hover { animation: none; }
  .czat-cofnij-pole.paruje:has(.czat-pigulka:hover)::before { animation: none; opacity: 1; }
}
.czat-cofnij-pole.paruje .czat-pigulka:focus-visible { animation: none; }
.czat-cofnij-pole.paruje:has(.czat-pigulka:focus-visible)::before { animation: none; opacity: 1; }
@keyframes czat-paruje {
  0% { opacity: 0; transform: translateY(10px) scale(.96); filter: blur(4px); animation-timing-function: cubic-bezier(.2, 0, 0, 1); }
  6.7% { opacity: 1; transform: none; filter: blur(0); }
  40% { opacity: 1; background-color: var(--c-tlo); box-shadow: var(--c-cien); animation-timing-function: ease-in-out; }
  70% { opacity: 1; transform: none; filter: blur(0); background-color: var(--c-tlo-jasne); box-shadow: var(--c-cien-lekki); animation-timing-function: cubic-bezier(.4, 0, .6, 1); }
  100% { opacity: 0; transform: translateY(-8px) scale(1.04); filter: blur(4px); background-color: transparent; box-shadow: var(--c-cien-zero); }
}
@keyframes czat-welon {
  0% { opacity: 0; animation-timing-function: cubic-bezier(.2, 0, 0, 1); }
  6.7% { opacity: 1; }
  40% { opacity: 1; animation-timing-function: ease-in-out; }
  70% { opacity: 0; }
  100% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .czat-cofnij-pole.paruje .czat-pigulka { animation-name: czat-paruje-cicho; } }
@keyframes czat-paruje-cicho {
  0% { opacity: 0; }
  6.7% { opacity: 1; }
  40% { opacity: 1; background-color: var(--c-tlo); box-shadow: var(--c-cien); }
  70% { opacity: 1; background-color: var(--c-tlo-jasne); box-shadow: var(--c-cien-lekki); }
  100% { opacity: 0; background-color: transparent; box-shadow: var(--c-cien-zero); }
}

/* ---- Porządki w rozmowie z wieczora 26.10.2026 (Jacek: „nawigacja za wysoko … podążanie za gridami”, „więcej powietrza”, kosz do opróżnienia,
   odpowiedź wychodząca poza ekran) i tryb HAL ---- */
.czat { --cz-niebezp: #b3000f; }
@media (prefers-color-scheme: dark) { .czat { --cz-niebezp: #ff6961; } }
/* Arkusz nad nawigacją-chmurką ma 8 px odstępu od niej i zaokrąglone wszystkie rogi. */
.czat-arkusz.nad-nawigacja { border-radius: 16px; }
.czat-pusto { gap: 32px; }

/* Górny rząd rozmowy ma tylko krzyżyk: koło w dwóch ostatnich kolumnach siatki. Historia i Nowa rozmowa stoją pod kciukiem, tuż nad polem
   pytania, każda na sześciu kolumnach (od 27.10.2026, Jacek: „Pod kciuk”; do tego dnia stały na górze, 5 + 5 + 2 kolumny). „Cofnij” po ruchu
   rozmowy stoi tuż nad tym rzędem. Rząd zostaje na miejscu także w Historii, Archiwum i Koszu, gdzie pola pytania nie ma. */
.czat-gora { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--km-rynna, 8px); align-items: center; min-height: 56px;
  padding: 8px calc(env(safe-area-inset-right, 0px) + 16px) 0 calc(env(safe-area-inset-left, 0px) + 16px); }
.czat-gora .czat-zamknij { grid-column: 11 / span 2; justify-self: center; }
.czat-nawi { position: relative; flex: none; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--km-rynna, 8px); align-items: center;
  padding: 8px calc(env(safe-area-inset-right, 0px) + 16px) 0 calc(env(safe-area-inset-left, 0px) + 16px); background: var(--cz-tlo); box-shadow: inset 0 .5px 0 var(--cz-ramka); }
.czat-nawi > .czat-pigulka { width: 100%; justify-content: center; padding: 0 8px; }
.czat-nawi > .czat-historia { grid-column: 1 / span 6; }
.czat-nawi > .czat-nowa { grid-column: 7 / span 6; }
.czat-nawi > .czat-cofnij-pole { bottom: calc(100% + 12px); }
/* Gdy „Cofnij” stoi nad rzędem Historia i Nowa rozmowa, dół listy zostawia mu miejsce (48 px pigułki, 12 px odstępu i 16 px oddechu), żeby nie zasłaniał
   chipów Archiwum i Kosz, które na krótkiej liście leżą tuż nad rzędem (zrzut z 27.10.2026: pigułka przykrywała napis „Kosz”). */
.czat-lista { transition: padding-bottom 200ms cubic-bezier(.2, 0, 0, 1); }
.czat.z-cofnij .czat-lista { padding-bottom: 76px; }
@media (prefers-reduced-motion: reduce) { .czat-lista { transition: none; } }
.czat-pole { box-shadow: none; }

/* Nagłówek Archiwum i Kosza na tej samej siatce: „‹ Historia” w pięciu kolumnach, nazwa w trzech, „Opróżnij” w czterech (napis czerwony, 5,9:1
   w jasnym i 4,9:1 w ciemnym). */
.czat-naglowek-listy { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--km-rynna, 8px); align-items: center; }
.czat-naglowek-listy .czat-wroc { grid-column: 1 / span 5; width: 100%; justify-content: center; padding: 0 8px; }
.czat-naglowek-listy .czat-gdzie { grid-column: 6 / span 3; text-align: center; }
/* Sekcje Schowka (od 27.10.2026): mała nazwa po lewej, a przy Koszu „Opróżnij” w czterech ostatnich kolumnach (napis czerwony). */
.czat-sekcja { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--km-rynna, 8px); align-items: center; min-height: 40px; margin-top: 8px; }
.czat-sekcja-nazwa { grid-column: 1 / span 6; margin: 0; color: var(--cz-tekst2); font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.czat-sekcja .czat-oproznij { grid-column: 9 / span 4; width: 100%; justify-content: center; padding: 0 8px; color: var(--cz-niebezp); }
.czat-oproznij > svg { display: none; }

/* Odnośnik pod odpowiedzią nigdy nie wychodzi poza ekran: napis łamie się gdziekolwiek i ma najwyżej dwie linie. */
.czat-akcja > span { min-width: 0; overflow: hidden; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }

/* Tryb HAL (od 26.10.2026 wieczorem; Jacek: „przytrzymać przez pół sekundy … tylko oko tego Hala. Podpis Hal jakiś tam, delikatny … głosowo,
   slightly animacyjnie”): cały ekran, białe tło (w ciemnym czarne), oko 176 px na środku, pod nim cichy podpis i napis tego, co HAL mówi.
   Oko mówi o stanie: czeka (oddycha), słucha (pulsuje), myśli (migocze), mówi (bije w rytmie mowy). Stan zostaje także przy ograniczonym ruchu. */
.czat.czat-hal { position: fixed; inset: 0; z-index: 60; display: grid; grid-template-rows: auto 1fr; padding: calc(var(--km-gora, env(safe-area-inset-top, 0px)) + 10px) 0 env(safe-area-inset-bottom, 0px);
  opacity: 0; transition: opacity 320ms ease; }
.czat.czat-hal.widac { opacity: 1; }
.czat-hal-gora { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--km-rynna, 8px); align-items: center; min-height: 60px;
  padding: 12px calc(env(safe-area-inset-right, 0px) + 16px) 0 calc(env(safe-area-inset-left, 0px) + 16px); }
.czat-hal-gora .czat-zamknij { grid-column: 11 / span 2; justify-self: center; }
.czat-hal-srodek { display: grid; align-content: center; justify-items: center; gap: 32px; padding: 0 24px 72px; text-align: center; }
.czat-hal-oko { position: relative; display: block; width: 176px; height: 176px; margin: 0; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer;
  -webkit-tap-highlight-color: transparent; transition: transform 320ms cubic-bezier(.3, 1.7, .5, 1); }
.czat-hal-oko:active { transform: scale(1.03); transition: transform 80ms ease; }
.czat-hal-oko:focus-visible { outline: 2px solid var(--cz-akcent); outline-offset: 8px; }
.czat-hal-oko .czat-oko { width: 176px; height: 176px;
  box-shadow: 0 0 0 .5px rgba(0, 0, 0, .28), 2px 2px 4px rgba(0, 0, 0, .2), 6px 6px 20px rgba(0, 0, 0, .18), 12px 12px 40px rgba(0, 0, 0, .12); }
.czat-hal-oko .czat-oko::after { inset: 15px;
  background: radial-gradient(circle at 34% 30%, rgba(255, 255, 255, .9) 0 4px, rgba(255, 255, 255, .25) 9px, rgba(255, 255, 255, 0) 16px),
    radial-gradient(circle, #ffd88a 0 3%, #ff5428 7%, #e10a0a 15%, #8c0000 28%, #2b0202 43%, #0a0a0a 55%, #050505);
  box-shadow: inset 0 0 0 3px #111111, inset 3px 3px 8px rgba(255, 255, 255, .12), inset -4px -4px 12px rgba(0, 0, 0, .6); }
.czat-hal[data-stan="czeka"] .czat-oko::after { animation: czat-hal-oddech 5s ease-in-out infinite; }
.czat-hal[data-stan="slucha"] .czat-oko::after { animation: czat-hal 2.2s ease-in-out infinite; }
.czat-hal[data-stan="mysli"] .czat-oko::after { animation: czat-hal-mysli 1.3s ease-in-out infinite; }
.czat-hal[data-stan="mowi"] .czat-oko::after { animation: czat-hal-mowi .9s ease-in-out infinite; }
@keyframes czat-hal-oddech { 0%, 100% { filter: brightness(.96); } 50% { filter: brightness(1.14); } }
@keyframes czat-hal-mysli { 0%, 100% { filter: brightness(.7) saturate(.9); } 40% { filter: brightness(1.35) saturate(1.2); } 70% { filter: brightness(.85); } }
@keyframes czat-hal-mowi {
  0%, 100% { filter: brightness(1); box-shadow: inset 0 0 0 3px #111111, 0 0 16px 3px rgba(255, 40, 20, .35); }
  50% { filter: brightness(1.5) saturate(1.3); box-shadow: inset 0 0 0 3px #111111, 0 0 38px 14px rgba(255, 40, 20, .6); } }
.czat-hal-podpis { margin: 0; color: var(--cz-tekst2); font-size: 13px; font-weight: 600; letter-spacing: .28em; text-transform: uppercase; }
.czat-hal-napis { min-height: 4.5em; max-width: 22em; margin: 0; color: var(--cz-tekst2); font-size: 16px; line-height: 1.5; }
</style>
</head>
